<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Table template</title>
    <link href="minimal-table.css" rel="stylesheet" type="text/css">
  </head>
  <body>
    <h1>Table template</h1>
    <!--The content of every table is enclosed by these two tags: <table></table>. Add these inside the body of your HTML. -->
    <table>
      <!--The smallest container inside a table is a table cell, which is created with a <td> element ("td" stands for "table data"). Add the following inside your table tags: -->
      <tr>
        <td>Hi, I'm your first cell.</td>
        <td>Im your second cell.</td>
        <td>Im your third cell.</td>
        <td>Im your fourth cell.</td>
      </tr>
      <tr>
        <td>Hi, I'm your second row first cell.</td>
        <td>Hi, I'm your second row second cell.</td>
        <td>Hi, I'm your second row third cell.</td>
        <td>Hi, I'm your second row fourth cell.</td>
      </tr>
        <!-- Each <td> element creates a single cell and together they make up the first row. Every cell we add makes the row grow longer.-->
    </table>


  </body>
</html>
